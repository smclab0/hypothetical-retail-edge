<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-label="retail-shed topology. The Liverpool store box sits on the HQ LAN at 172.16.0.71 and its agents reach the VIP directly; an iPhone on the LAN Wi-Fi opens its till over HTTP. HQ: three RKE2 nodes running Rancher from the rancher-stable chart; MetalLB announces VIP 172.16.0.251, shared by the kubernetes-vip service on 6443 and 9345, whose endpoints Endpoint Copier Operator copies from the apiservers, and by the ingress on 80 and 443. Fleet in Rancher polls the GitHub repo every 30 seconds. Six stores sit on separate libvirt NAT networks on vrack0, where wan.sh shapes each store's link. Store agents dial out through NAT to the VIP on 443, and store nodes pull the store-pos image from ghcr.io.">
        <style>
svg { --bg: #f5f7f6; --panel: #ffffff; --ink: #17201c; --muted: #5a6762; --line: #c9d3cf; --zone: #e9efec; --accent: #1f8a5b; --accent-soft: #d6efe3; --wan: #b4561f; color: var(--ink); }
@media (prefers-color-scheme: dark) { svg { --bg: #111715; --panel: #18201d; --ink: #e4ebe8; --muted: #95a39d; --line: #33413b; --zone: #1d2723; --accent: #4cc48b; --accent-soft: #1d3a2d; --wan: #e08a52; } }
text { font-family: "Public Sans", "Segoe UI", system-ui, sans-serif; fill: currentColor; }
.mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
.disp { font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif; font-weight: 600; }
.muted { fill: var(--muted); }
.acc { fill: var(--accent); }
.wan { fill: var(--wan); }
</style>
<rect width="1200" height="980" fill="var(--panel)"/>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
          <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
        </defs>

        <!-- Outside the lab -->
        <rect x="40" y="14" width="190" height="46" rx="4" fill="var(--panel)" stroke="var(--line)"/>
        <text x="135" y="34" text-anchor="middle" font-size="13" font-weight="600">Workstation</text>
        <text x="135" y="51" text-anchor="middle" font-size="11" class="mono muted">/etc/hosts → .251</text>

        <rect x="260" y="14" width="250" height="46" rx="4" fill="var(--panel)" stroke="var(--line)"/>
        <text x="385" y="34" text-anchor="middle" font-size="13" font-weight="600">GitHub</text>
        <text x="385" y="51" text-anchor="middle" font-size="11" class="mono muted">smclab0/retail-shed-fleet</text>

        <rect x="860" y="14" width="250" height="46" rx="4" fill="var(--panel)" stroke="var(--line)"/>
        <text x="985" y="34" text-anchor="middle" font-size="13" font-weight="600">ghcr.io</text>
        <text x="985" y="51" text-anchor="middle" font-size="11" class="mono muted">smclab0/store-pos:1.0.0</text>

        <!-- vrack0 -->
        <rect x="20" y="84" width="1160" height="780" rx="6" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="6 5"/>
        <text x="36" y="104" font-size="12" class="mono muted">vrack0 · KVM host 172.16.0.69 · 48 threads · 377 GB</text>

        <!-- HQ zone -->
        <rect x="40" y="116" width="470" height="732" rx="4" fill="var(--zone)"/>
        <text x="56" y="138" font-size="15" class="disp">HQ LAN · bridge br0 · 172.16.0.0/16</text>

        <rect x="60" y="152" width="430" height="50" rx="4" fill="var(--panel)" stroke="var(--line)"/>
        <text x="76" y="173" font-size="13" font-weight="600">Rancher Fleet</text>
        <text x="76" y="191" font-size="11" class="mono muted">GitRepo retail-shed-stores · path fleet/store-pos</text>

        <!-- VIP -->
        <circle cx="275" cy="282" r="48" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
        <text x="275" y="274" text-anchor="middle" font-size="12" class="mono">VIP</text>
        <text x="275" y="292" text-anchor="middle" font-size="15" class="mono acc" font-weight="500">.251</text>
        <text x="275" y="309" text-anchor="middle" font-size="10" class="mono muted">MetalLB L2</text>

        <rect x="60" y="356" width="200" height="54" rx="4" fill="var(--panel)" stroke="var(--line)"/>
        <text x="76" y="378" font-size="13" font-weight="600">kubernetes-vip</text>
        <text x="76" y="397" font-size="11" class="mono muted">6443 api · 9345 join</text>
        <rect x="290" y="356" width="200" height="54" rx="4" fill="var(--panel)" stroke="var(--line)"/>
        <text x="306" y="378" font-size="13" font-weight="600">ingress-nginx</text>
        <text x="306" y="397" font-size="11" class="mono muted">80 · 443 → Rancher UI</text>
        <line x1="248" y1="318" x2="172" y2="354" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ara)"/>
        <line x1="302" y1="318" x2="378" y2="354" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ara)"/>
        <text x="275" y="346" text-anchor="middle" font-size="10" class="mono muted">shared IP</text>

        <!-- Rancher nodes -->
        <g font-size="11">
          <rect x="60" y="476" width="130" height="92" rx="4" fill="var(--panel)" stroke="var(--line)"/>
          <text x="72" y="497" font-weight="600" font-size="12">retail-rancher01</text>
          <text x="72" y="515" class="mono muted">.133</text>
          <rect x="210" y="476" width="130" height="92" rx="4" fill="var(--panel)" stroke="var(--line)"/>
          <text x="222" y="497" font-weight="600" font-size="12">retail-rancher02</text>
          <text x="222" y="515" class="mono muted">.134</text>
          <rect x="360" y="476" width="130" height="92" rx="4" fill="var(--panel)" stroke="var(--line)"/>
          <text x="372" y="497" font-weight="600" font-size="12">retail-rancher03</text>
          <text x="372" y="515" class="mono muted">.135</text>
          <text x="72" y="538" class="muted">RKE2 1.35.8</text><text x="72" y="555" class="muted">Rancher 2.15.2</text>
          <text x="222" y="538" class="muted">RKE2 1.35.8</text><text x="222" y="555" class="muted">Rancher 2.15.2</text>
          <text x="372" y="538" class="muted">RKE2 1.35.8</text><text x="372" y="555" class="muted">Rancher 2.15.2</text>
        </g>
        <path d="M160 412 L125 474 M160 412 L275 474 M160 412 L425 474" fill="none" stroke="currentColor" stroke-opacity=".6" marker-end="url(#ar)"/>
        <text x="60" y="446" font-size="10" class="mono muted">ECO copies</text>
        <text x="60" y="459" font-size="10" class="mono muted">apiserver endpoints</text>

        <rect x="60" y="590" width="430" height="78" rx="4" fill="none" stroke="var(--line)" stroke-dasharray="3 3"/>
        <text x="76" y="612" font-size="12" font-weight="600">If the announcing node dies</text>
        <text x="76" y="630" font-size="11" class="muted">MetalLB re-announces .251 from a surviving node</text>
        <text x="76" y="647" font-size="11" class="muted">(gratuitous ARP). No HAProxy or keepalived VMs.</text>
        <text x="76" y="664" font-size="11" class="mono muted">Nodes 02 and 03 joined via https://.251:9345</text>

        <!-- Liverpool: a store box on the HQ LAN itself -->
        <rect x="60" y="690" width="430" height="140" rx="4" fill="var(--panel)" stroke="var(--accent)"/>
        <text x="76" y="714" font-size="15" class="disp">liv-001 · store on the HQ LAN</text>
        <text x="76" y="733" font-size="11" class="mono muted">store-liv-001-n1 · 172.16.0.71 (DHCP)</text>
        <text x="76" y="751" font-size="11" class="muted">liverpool · SL Micro · 1 × K3s</text>
        <text x="76" y="776" font-size="11" class="muted">No store router or NAT: agents reach .251 directly.</text>
        <text x="76" y="793" font-size="11" class="muted">Pi-hole resolves the Rancher name (box and CoreDNS</text>
        <text x="76" y="810" font-size="11" class="muted">fall back to .251 if it does not). No wan.sh shaping.</text>
        <rect x="404" y="702" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="436" y="718" text-anchor="middle" font-size="11" class="mono">till</text>
        <path d="M60 760 L48 760 L48 300 L224 289" fill="none" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#ara)"/>
        <text x="44" y="640" font-size="10" class="mono acc" transform="rotate(-90 44 640)">agents → :443 direct</text>

        <!-- iPhone on the LAN Wi-Fi -->
        <rect x="140" y="886" width="46" height="84" rx="9" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/>
        <rect x="146" y="896" width="34" height="62" rx="2" fill="var(--accent-soft)"/>
        <rect x="155" y="890" width="16" height="3" rx="1.5" fill="currentColor"/>
        <text x="163" y="930" text-anchor="middle" font-size="9" class="mono">till</text>
        <text x="200" y="908" font-size="13" font-weight="600">iPhone</text>
        <text x="200" y="926" font-size="11" class="mono muted">Wi-Fi on 172.16.0.0/16</text>
        <text x="200" y="943" font-size="11" class="mono muted">Safari → http://172.16.0.71/</text>
        <line x1="163" y1="884" x2="163" y2="834" stroke="currentColor" stroke-opacity=".75" marker-end="url(#ar)"/>
        <text x="171" y="880" font-size="11" class="mono muted">HTTP :80</text>

        <!-- External arrows -->
        <line x1="135" y1="62" x2="232" y2="246" stroke="currentColor" stroke-opacity=".7" marker-end="url(#ar)"/>
        <text x="150" y="225" font-size="11" class="mono muted">HTTPS</text>
        <line x1="385" y1="150" x2="385" y2="62" stroke="currentColor" stroke-opacity=".7" marker-end="url(#ar)"/>
        <text x="393" y="110" font-size="11" class="mono muted">polls main · 30s</text>

        <!-- NAT spine -->
        <rect x="560" y="116" width="96" height="664" rx="4" fill="var(--zone)"/>
        <text x="608" y="140" text-anchor="middle" font-size="13" class="disp">NAT</text>
        <text x="608" y="158" text-anchor="middle" font-size="10" class="mono muted">nftables</text>
        <text x="608" y="756" text-anchor="middle" font-size="10" class="mono wan">tc · wan.sh</text>
        <text x="608" y="770" text-anchor="middle" font-size="10" class="mono muted">per bridge</text>

        <!-- agents dial out: stores -> NAT -> VIP -->
        <path d="M560 300 L330 290" fill="none" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#ara)"/>
        <text x="372" y="244" font-size="11" class="mono acc">cattle-cluster-agent</text>
        <text x="372" y="259" font-size="11" class="mono acc">+ fleet-agent dial out</text>
        <text x="372" y="274" font-size="11" class="mono acc">→ :443 (outbound only)</text>

        <!-- image pull -->
        <line x1="985" y1="62" x2="985" y2="112" stroke="currentColor" stroke-opacity=".7" stroke-dasharray="4 3" marker-end="url(#ar)"/>
        <text x="995" y="92" font-size="11" class="mono muted">image pull via NAT</text>

        <!-- Stores -->
        <g font-size="11">
          <!-- row template: y, h=100 -->
          <g transform="translate(680 116)">
            <rect width="480" height="100" rx="4" fill="var(--panel)" stroke="var(--accent)"/>
            <text x="16" y="26" font-size="15" class="disp">lon-001 · flagship</text>
            <text x="16" y="45" class="mono muted">rtl-lon-001 · 10.120.1.0/24</text>
            <text x="16" y="62" class="muted">london · price ×1.12</text>
            <g class="mono"><rect x="16" y="72" width="40" height="20" rx="3" fill="var(--zone)"/><text x="36" y="86" text-anchor="middle">n1</text>
            <rect x="62" y="72" width="40" height="20" rx="3" fill="var(--zone)"/><text x="82" y="86" text-anchor="middle">n2</text>
            <rect x="108" y="72" width="40" height="20" rx="3" fill="var(--zone)"/><text x="128" y="86" text-anchor="middle">n3</text></g>
            <text x="156" y="86" class="muted">K3s HA etcd</text>
            <rect x="320" y="26" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="352" y="42" text-anchor="middle" class="mono">till</text>
            <rect x="392" y="26" width="72" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="428" y="42" text-anchor="middle" class="mono">collect</text>
          </g>
          <g transform="translate(680 228)">
            <rect width="480" height="84" rx="4" fill="var(--panel)" stroke="var(--line)"/>
            <text x="16" y="26" font-size="15" class="disp">lon-002</text>
            <text x="16" y="45" class="mono muted">rtl-lon-002 · 10.120.2.0/24</text>
            <text x="16" y="66" class="muted">london · price ×1.12 · 1 × K3s</text>
            <rect x="320" y="26" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="352" y="42" text-anchor="middle" class="mono">till</text>
          </g>
          <g transform="translate(680 324)">
            <rect width="480" height="84" rx="4" fill="var(--panel)" stroke="var(--line)"/>
            <text x="16" y="26" font-size="15" class="disp">man-001</text>
            <text x="16" y="45" class="mono muted">rtl-man-001 · 10.120.3.0/24</text>
            <text x="16" y="66" class="muted">manchester · base prices · 1 × K3s</text>
            <rect x="320" y="26" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="352" y="42" text-anchor="middle" class="mono">till</text>
          </g>
          <g transform="translate(680 420)">
            <rect width="480" height="84" rx="4" fill="var(--panel)" stroke="var(--line)"/>
            <text x="16" y="26" font-size="15" class="disp">edi-001</text>
            <text x="16" y="45" class="mono muted">rtl-edi-001 · 10.120.4.0/24</text>
            <text x="16" y="66" class="muted">edinburgh · own banner · 1 × K3s</text>
            <rect x="320" y="26" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="352" y="42" text-anchor="middle" class="mono">till</text>
          </g>
          <g transform="translate(680 516)">
            <rect width="480" height="84" rx="4" fill="var(--panel)" stroke="var(--line)"/>
            <text x="16" y="26" font-size="15" class="disp">bri-001</text>
            <text x="16" y="45" class="mono muted">rtl-bri-001 · 10.120.5.0/24</text>
            <text x="16" y="66" class="muted">bristol · base prices · 1 × K3s</text>
            <rect x="320" y="26" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="352" y="42" text-anchor="middle" class="mono">till</text>
          </g>
          <g transform="translate(680 612)">
            <rect width="480" height="84" rx="4" fill="var(--panel)" stroke="var(--line)"/>
            <text x="16" y="26" font-size="15" class="disp">gla-001 · kiosk</text>
            <text x="16" y="45" class="mono muted">rtl-gla-001 · 10.120.6.0/24</text>
            <text x="16" y="66" class="muted">glasgow · SLES 16 + GNOME · 1 × K3s</text>
            <rect x="320" y="26" width="64" height="24" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="352" y="42" text-anchor="middle" class="mono">till</text>
            <rect x="392" y="26" width="72" height="24" rx="3" fill="var(--zone)" stroke="var(--line)"/><text x="428" y="42" text-anchor="middle" class="mono">screen</text>
          </g>
          <!-- store bridges into the NAT spine, each with its own tc qdisc -->
          <g stroke="var(--wan)" stroke-width="1.5">
            <line x1="680" y1="166" x2="656" y2="166"/><line x1="680" y1="270" x2="656" y2="270"/>
            <line x1="680" y1="366" x2="656" y2="366"/><line x1="680" y1="462" x2="656" y2="462"/>
            <line x1="680" y1="558" x2="656" y2="558"/><line x1="680" y1="654" x2="656" y2="654"/>
          </g>
          <g fill="var(--wan)">
            <rect x="664" y="161" width="8" height="10"/><rect x="664" y="265" width="8" height="10"/>
            <rect x="664" y="361" width="8" height="10"/><rect x="664" y="457" width="8" height="10"/>
            <rect x="664" y="553" width="8" height="10"/><rect x="664" y="649" width="8" height="10"/>
          </g>
          <text x="680" y="722" class="mono muted">Stores can't reach each other; libvirt drops forwarding between store networks.</text>
          <text x="680" y="739" class="mono muted">Each store router (.1) answers rancher.retail-shed.local with .251.</text>
          <text x="680" y="756" class="mono wan">Orange marks: tc on each rtl-* bridge (delay, loss, rate, outage).</text>
        </g>
      </svg>
